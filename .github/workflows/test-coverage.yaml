on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: test-coverage

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::covr
            any::testthat
            any::withr
            local::.
          needs: coverage

      - name: Test coverage
        run: |
          coverage <- covr::package_coverage()
          print(coverage)
          measured <- sprintf("%.1f", covr::percent_coverage(coverage))
          readme <- paste(readLines("README.md", warn = FALSE), collapse = "\n")
          badge_match <- regmatches(
            readme,
            regexec("img\\.shields\\.io/badge/coverage-([0-9]+[.][0-9]+)%25", readme)
          )[[1L]]
          if (length(badge_match) != 2L || !identical(badge_match[[2L]], measured)) {
            stop(sprintf("README coverage badge does not match measured coverage %.1f%%.", as.numeric(measured)))
          }
          cat(sprintf("Total coverage: %s%%\n", measured))
        shell: Rscript {0}
