on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: test-coverage

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: |
            any::covr
            any::testthat
            any::withr
            local::.
          needs: coverage

      - name: Test coverage
        run: |
          coverage <- covr::package_coverage()
          print(coverage)
          cat(sprintf("Total coverage: %.1f%%\n", covr::percent_coverage(coverage)))
        shell: Rscript {0}
